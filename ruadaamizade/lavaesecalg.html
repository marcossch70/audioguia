<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="frame-src https://www.youtube.com;">
    <title>Embedded YouTube Shorts</title>
</head>
<body>
    <h1>Lava e Seca LG</h1>

    <!-- Correct embed format for YouTube Shorts -->

        src="https://www.youtube.com/embed/Ez4TeqsgZTc" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
    </iframe>

    <h1>Para secar</h1>

</html>
