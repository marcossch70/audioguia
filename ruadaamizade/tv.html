<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="frame-src https://www.youtube.com;">
    <title>Embedded YouTube Shorts</title>
</head>
<body>
    <h1>Como usar a TV</h1>

    <!-- Correct embed format for YouTube Shorts -->
    <iframe width="560" height="315" 
        src="https://www.youtube.com/embed/6HPsJZjjeVI" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
    </iframe>

   
</body>
</html>
